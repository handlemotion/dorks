[workspace]
members = [".", "crates/shell-core"]
resolver = "2"

[package]
name = "dorks-desktop"
version = "0.17.0"
description = "Dorks desktop shell"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "dorks_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "dorks-desktop"
path = "src/main.rs"

[features]
# Auto-update scaffolding. Off for local builds; the release workflow enables it together with an updater config overlay
# (see docs/desktop.md). Nothing in the repo carries a signing key.
updater = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dorks-shell-core = { path = "crates/shell-core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# `dorks://` links (invitations, pairing codes): registers the scheme from tauri.conf.json and hands the app each URL (src/deep_link.rs).
tauri-plugin-deep-link = "2"
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Native window material (NSVisualEffectView, and NSGlassEffectView on macOS 26) and the traffic-light buttons. Same major
# versions Tauri itself links, so the lockfile gains no new crates.
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAppearance", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
# Open at login (SMAppService, macOS 13+) and the App Nap opt-out (NSProcessInfo activity) while automations are scheduled.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSObject", "NSProcessInfo", "NSString"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
