[package]
name = "dorks-shell-core"
version = "0.1.0"
description = "Platform-independent parts of the Dorks desktop shell: data dir, secrets, settings, ports, sidecar supervision, tunnel and keep-awake interfaces"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "dorks_shell_core"
path = "src/lib.rs"

[[bin]]
# Stand-in for the real `dorks-server` (Bun, Hono, SQLite; apps/server) until it exists. Speaks the same env contract.
name = "dorks-server-stub"
path = "src/bin/dorks-server-stub.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "io-util", "sync", "fs"] }
getrandom = "0.3"
libc = "0.2"
# The tunnel service call. TLS through rustls with ring, both already in the app's dependency tree (no aws-lc, cmake or OpenSSL).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
tempfile = "3"
