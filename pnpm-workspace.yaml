packages:
  - apps/*
  - packages/*
  - infra/bridge
  - infra/tunnels
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.6.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.6.0"
  - vite-plus@1.6.0
  - "@cloudflare/build-output-utils@0.9.13"
  - "@cloudflare/config@0.32.0"
  - "@cloudflare/runtime-types@0.1.26"
  - "@cloudflare/vite-plugin@2.0.0-beta.v.15"
  - cf@1.0.0-beta.30
  - miniflare@5.20261110.1-beta
