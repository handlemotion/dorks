packages:
  - apps/*
  - packages/*
  - infra/bridge
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
overrides:
  vite@*: "catalog:"
  # One React for the whole workspace: Expo SDK 58 (apps/mobile) pins 19.3.0, and @dorks/client must see the same copy as each app.
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": ~19.3.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.6.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.6.0"
  - vite-plus@1.6.0
patchedDependencies:
  "@shadcn/react@0.3.1": patches/@shadcn__react@0.3.1.patch
