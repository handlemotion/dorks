name: Release

# The whole release flow, on every push to main (docs/releasing.md):
#   1. PRs add changesets (`pnpm changeset`). While any are on main, this keeps one PR open, "Release Dorks", that applies them:
#      the version in apps/desktop/package.json, tauri.conf.json, Cargo.toml and Cargo.lock, and apps/desktop/CHANGELOG.md.
#   2. Merging that PR puts a version on main that has no GitHub release yet, so this builds, signs and notarizes it and
#      publishes the release (desktop-release.yml). Installed apps find it within 4 hours and show the update in the sidebar.
# Needs "Allow GitHub Actions to create and approve pull requests" in the repository's Actions settings.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-pr:
    name: Open or update the release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the release branch
      pull-requests: write # open the release PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # @changesets/changelog-github links each change to its PR
        with:
          version-script: pnpm release:version
          commit-message: Release Dorks
          pr-title: Release Dorks

  unreleased:
    name: Is this version released?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A published release for this version means it shipped; a draft is a build that failed half way, so build again.
          draft="$(gh release view "desktop-v$version" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          if [ "$draft" = "false" ]; then echo "release=false" >> "$GITHUB_OUTPUT"; echo "Dorks $version is already released."
          else echo "release=true" >> "$GITHUB_OUTPUT"; echo "Dorks $version has no published release: building it."; fi

  build:
    name: Build and publish Dorks ${{ needs.unreleased.outputs.version }}
    needs: unreleased
    if: needs.unreleased.outputs.release == 'true'
    permissions:
      contents: write # create the release and upload its assets
    uses: ./.github/workflows/desktop-release.yml
    with:
      version: ${{ needs.unreleased.outputs.version }}
    secrets: inherit
