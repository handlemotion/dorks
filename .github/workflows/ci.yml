name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No real secrets anywhere in this workflow: every key below is generated per run.
jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true # pnpm version comes from "packageManager" in the root package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r --if-present test

  backend-e2e:
    name: Backend and web e2e (self-hosted Convex)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OUT: /tmp/dorks-e2e
      CONVEX_URL: http://127.0.0.1:3210
      CONVEX_SITE_URL: http://127.0.0.1:3211
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile

      - name: Start Convex backend
        # Pinned by digest (the :latest of 2026-10-07); bump deliberately.
        run: |
          docker run -d --name convex-local --network host \
            -e INSTANCE_NAME=dorks-ci \
            -e INSTANCE_SECRET="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')" \
            -e CONVEX_CLOUD_ORIGIN=http://127.0.0.1:3210 \
            -e CONVEX_SITE_ORIGIN=http://127.0.0.1:3211 \
            -e DO_NOT_REQUIRE_SSL=1 \
            ghcr.io/get-convex/convex-backend@sha256:d715e9ec088784407ca4ba2d3db592702cd328d02c76cdca3852c0018f2a76b4
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:3210/version >/dev/null && exit 0
            sleep 1
          done
          echo "Convex backend did not become healthy" >&2
          docker logs convex-local >&2
          exit 1

      - name: Deploy functions and set throwaway env
        working-directory: apps/convex
        run: |
          key="$(docker exec convex-local ./generate_admin_key.sh | tail -1)"
          echo "::add-mask::$key"
          printf 'CONVEX_SELF_HOSTED_URL=http://127.0.0.1:3210\nCONVEX_SELF_HOSTED_ADMIN_KEY=%s\n' "$key" > .env.local
          npx convex dev --once
          git diff --exit-code -- convex/_generated # generated code must be committed, not drift
          rnd() { node -e 'console.log(require("crypto").randomBytes(32).toString(process.argv[1]))' "$1"; }
          set_env() { npx convex env set "$1" "$2" >/dev/null; }
          for name in BETTER_AUTH_SECRET BRIDGE_SECRET_KEY SIM_HOST_KEY; do set_env "$name" "$(rnd hex)"; done
          set_env ENCRYPTION_KEY "$(rnd base64)"
          set_env RESEND_API_KEY re_test_local
          set_env RESEND_API_URL http://127.0.0.1:8899/emails
          set_env SITE_URL http://localhost:3000
          set_env BOX_PROVIDER sim
          set_env BASE_SNAPSHOT_ID sim-snap
          set_env EXTRA_TRUSTED_ORIGINS http://localhost:8081

      - name: Backend e2e and secret scan
        working-directory: apps/convex
        run: ./scripts/run-e2e.sh

      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
      - name: Web e2e
        working-directory: apps/convex
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          SHOTS: /tmp/dorks-e2e
        run: |
          mkdir -p "$OUT"
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          (cd ../web && VITE_CONVEX_URL="$CONVEX_URL" VITE_CONVEX_SITE_URL="$CONVEX_SITE_URL" exec pnpm dev > "$OUT/web-dev.log" 2>&1) &
          SIM_HOST_KEY="$(npx convex env get SIM_HOST_KEY)" BRIDGE_SECRET_KEY="$(npx convex env get BRIDGE_SECRET_KEY)" SIM_DELTAS=100 \
            node ../../infra/bridge-sim/host.mjs > "$OUT/web-host.log" 2>&1 &
          for _ in $(seq 90); do
            curl -sf -o /dev/null http://localhost:3000/dorks && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3000/dorks || { tail -50 "$OUT/web-dev.log"; exit 1; }
          node scripts/web-e2e.mjs

      - name: Collect backend container logs
        if: ${{ !success() }}
        run: |
          mkdir -p "$OUT"
          docker logs convex-local > "$OUT/backend-container.log" 2>&1 || true
      - name: Upload e2e logs
        if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dorks-e2e-logs
          # Logs and screenshots only. The table export and needles.json hold the raw (throwaway) values, so they stay out.
          path: |
            ${{ env.OUT }}/*.log
            ${{ env.OUT }}/*.png
          if-no-files-found: ignore
          retention-days: 7
