name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No repository secrets are needed: every key below is generated per run, so the workflow also passes on forks.
jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true # pnpm version comes from "packageManager" in the root package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r --if-present test

  web-e2e:
    name: Web build and e2e (mock server)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dorks/web build
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
      - name: Web e2e (built SPA in headless Chrome against the in-memory mock server)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          SHOTS: /tmp/dorks-web-e2e
        run: |
          mkdir -p "$SHOTS"
          pnpm --filter @dorks/web e2e
      - name: Upload screenshots
        if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dorks-web-e2e-shots
          path: /tmp/dorks-web-e2e/*.png
          if-no-files-found: ignore
          retention-days: 7

  server-e2e:
    name: Server e2e (compiled binary, simulated sandboxes)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dorks/server build
      - name: E2E with the simulated bridge
        run: SERVER_BIN="$PWD/apps/server/dist/dorks-server" node apps/server/scripts/e2e.mjs
      - name: E2E with the real in-box bridge (fake Claude CLI)
        run: SERVER_BIN="$PWD/apps/server/dist/dorks-server" BRIDGE_IMPL=real node apps/server/scripts/e2e.mjs
