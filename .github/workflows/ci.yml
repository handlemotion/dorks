name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No repository secrets are needed: every key below is generated per run, so the workflow also passes on forks.
jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true # pnpm version comes from "packageManager" in the root package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r --if-present test

  web-e2e:
    name: Web build and e2e (mock server)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dorks/web build
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
      - name: Web e2e (built SPA in headless Chrome against the in-memory mock server)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          SHOTS: /tmp/dorks-web-e2e
        run: |
          mkdir -p "$SHOTS"
          pnpm --filter @dorks/web e2e
      - name: Upload screenshots
        if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dorks-web-e2e-shots
          path: /tmp/dorks-web-e2e/*.png
          if-no-files-found: ignore
          retention-days: 7

  server-e2e:
    name: Server e2e (compiled binary, simulated sandboxes)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dorks/server build
      - name: E2E with the simulated bridge
        run: SERVER_BIN="$PWD/apps/server/dist/dorks-server" node apps/server/scripts/e2e.mjs
      - name: E2E with the real in-box bridge (fake Claude CLI)
        run: SERVER_BIN="$PWD/apps/server/dist/dorks-server" BRIDGE_IMPL=real node apps/server/scripts/e2e.mjs

  backend-e2e:
    name: Backend e2e (self-hosted Convex)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OUT: /tmp/dorks-e2e
      CONVEX_URL: http://127.0.0.1:3210
      CONVEX_SITE_URL: http://127.0.0.1:3211
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile

      - name: Start Convex backend
        # Pinned by digest (the :latest of 2026-10-07); bump deliberately.
        run: |
          docker run -d --name convex-local --network host \
            -e INSTANCE_NAME=dorks-test \
            -e INSTANCE_SECRET="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')" \
            -e CONVEX_CLOUD_ORIGIN=http://127.0.0.1:3210 \
            -e CONVEX_SITE_ORIGIN=http://127.0.0.1:3211 \
            -e DO_NOT_REQUIRE_SSL=1 \
            ghcr.io/convex/convex-backend@sha256:d715e9ec088784407ca4ba2d3db592702cd328d02c76cdca3852c0018f2a76b4
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:3210/version >/dev/null && exit 0
            sleep 1
          done
          echo "Convex backend did not become healthy" >&2
          docker logs convex-local >&2
          exit 1

      - name: Deploy functions and set throwaway env
        working-directory: apps/convex
        run: |
          key="$(docker exec convex-local ./generate_admin_key.sh | tail -1)"
          echo "::add-mask::$key"
          printf 'CONVEX_SELF_HOSTED_URL=http://127.0.0.1:3210\nCONVEX_SELF_HOSTED_ADMIN_KEY=%s\n' "$key" > .env.local
          npx convex dev --once
          git diff --exit-code -- convex/_generated # generated code must be committed, not drift
          rnd() { node -e 'console.log(require("crypto").randomBytes(32).toString(process.argv[1]))' "$1"; }
          set_env() { npx convex env set "$1" "$2" >/dev/null; }
          for name in BETTER_AUTH_SECRET BRIDGE_SECRET_KEY SIM_HOST_KEY GITHUB_WEBHOOK_SECRET; do set_env "$name" "$(rnd hex)"; done
          set_env ENCRYPTION_KEY "$(rnd base64)"
          set_env RESEND_API_KEY re_test_local
          set_env RESEND_API_URL http://127.0.0.1:8899/emails
          set_env SITE_URL http://localhost:3000
          set_env BOX_PROVIDER sim
          set_env GITHUB_APP_SLUG dorks-test
          set_env BASE_SNAPSHOT_ID sim-snap

      - name: Backend e2e and secret scan
        working-directory: apps/convex
        run: ./scripts/run-e2e.sh

      - name: Collect backend container logs
        if: ${{ !success() }}
        run: |
          mkdir -p "$OUT"
          docker logs convex-local > "$OUT/backend-container.log" 2>&1 || true
      - name: Upload e2e logs
        if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dorks-e2e-logs
          # Logs and screenshots only. The table export and needles.json hold the raw (throwaway) values, so they stay out.
          path: |
            ${{ env.OUT }}/*.log
            ${{ env.OUT }}/*.png
          if-no-files-found: ignore
          retention-days: 7
