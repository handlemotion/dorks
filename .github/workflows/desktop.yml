name: Desktop

# Builds and tests the Tauri shell on macOS (the Linux `checks` job in ci.yml only covers the pure shell-core crate).
# Needs no secrets.
on:
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: Lint, test and build the unsigned universal app
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - name: Prepare the sidecar (stub until apps/server ships a binary) and UI
        working-directory: apps/desktop
        run: |
          node scripts/prepare-sidecar.mjs --target universal-apple-darwin
          node scripts/prepare-ui.mjs
      - name: Clippy and tests
        working-directory: apps/desktop
        run: pnpm check:app
      - name: Build the unsigned universal app
        working-directory: apps/desktop
        run: pnpm tauri build --debug --bundles app --target universal-apple-darwin
