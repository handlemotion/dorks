name: Copilot Setup Steps

# GitHub Copilot's coding agent runs the job named `copilot-setup-steps` before it starts. It does the same thing as every other
# provider: run cloud-setup.sh. Give the agent DOPPLER_TOKEN as a secret of the `copilot` environment.
on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml, cloud-setup.sh]

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: copilot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: bash cloud-setup.sh
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
